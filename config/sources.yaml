# sources.yaml — label sources, their licences, and their terms-of-use status.
#
# SPEC.md §6.2 requires that each site's terms of use are checked and recorded
# here BEFORE ingesting, and that anything prohibiting redistribution is
# flagged and NOT worked around. A source with `status: blocked` has no
# ingester and must not gain one without the ToS position changing.
#
# `checked` is the date a human last read the terms. Re-check before relying
# on any source older than 90 days.

version: 1

sources:
  # -------------------------------------------------------------------------
  # Sanctions. Public-domain government publications. confidence 1.0.
  # -------------------------------------------------------------------------
  - id: ofac
    name: "OFAC Specially Designated Nationals list"
    status: allowed
    confidence: 1.0
    schedule: daily
    # The classic SDN XML. The "enhanced" export (SDN_ENHANCED.XML) uses a
    # different schema that the parser does not read; it was configured here
    # until 2026-09-21 and silently produced no labels (docs/DECISIONS.md D20).
    url: "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.XML"
    format: xml
    licence: "US Government work, public domain (17 U.S.C. §105)"
    redistribution: permitted
    checked: 2026-09-21
    notes: >
      Crypto addresses appear as Digital Currency Address features (XBT, ETH,
      USDT, TRX and others). Parse the feature type to recover the chain
      rather than guessing from address shape.

  - id: un
    name: "UN Security Council Consolidated List"
    status: allowed
    confidence: 1.0
    schedule: daily
    url: "https://scsanctions.un.org/resources/xml/en/consolidated.xml"
    format: xml
    licence: "UN material, reproduction permitted with attribution"
    redistribution: permitted
    checked: 2026-09-20
    notes: >
      Carries far fewer crypto addresses than OFAC. Ingested for completeness
      and because a listing here that is absent from OFAC is exactly the gap
      worth catching.

  - id: eu
    name: "EU Consolidated Financial Sanctions List"
    status: allowed
    confidence: 1.0
    schedule: daily
    url: "https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content"
    format: xml
    licence: "EU public data, reuse permitted (Decision 2011/833/EU)"
    redistribution: permitted
    checked: 2026-09-20

  # -------------------------------------------------------------------------
  # Block explorers. SPEC.md §6.2 asks for these at confidence 0.9 and then
  # instructs us to stop rather than work around a prohibition. The
  # instruction resolves to "do not ingest". See docs/PLAN.md flag F2.
  # -------------------------------------------------------------------------
  - id: etherscan
    name: "Etherscan public address nametags"
    status: blocked
    confidence: 0.9
    checked: 2026-09-20
    blocked_reason: >
      Address nametags/labels are not exposed through the Etherscan API at
      all; they exist only on rendered HTML pages. Obtaining them therefore
      requires scraping, and the Etherscan Terms of Service prohibit
      automated extraction and redistribution of site content. SPEC.md §6.2
      directs us to stop rather than work around this, so no ingester exists
      for this source and none should be added while this clause stands.
    substitutes: [dune, curated, "derived:deposit"]

  - id: bscscan
    name: "BscScan public address nametags"
    status: blocked
    confidence: 0.9
    checked: 2026-09-20
    blocked_reason: >
      Same operator and materially identical terms to etherscan. Not ingested.
    substitutes: [dune, curated, "derived:deposit"]

  - id: tronscan
    name: "Tronscan public address tags"
    status: blocked
    confidence: 0.9
    checked: 2026-09-20
    blocked_reason: >
      No documented public labels endpoint and no published licence granting
      redistribution of tag data. Treated as prohibited until a human obtains
      written clarification; recorded here so the decision is visible rather
      than silently skipped.
    substitutes: [dune, curated, "derived:deposit"]

  # -------------------------------------------------------------------------
  # Open-licensed community labels.
  # -------------------------------------------------------------------------
  - id: dune
    name: "Dune Spellbook labels"
    status: unavailable
    confidence: 0.8
    schedule: weekly
    url: "https://github.com/duneanalytics/spellbook"
    format: git
    licence: "Apache-2.0"
    redistribution: permitted
    checked: 2026-09-20
    unavailable_reason: >
      The spellbook's label models are dbt SQL that selects from Dune's own
      warehouse (source('cex','addresses')), not static address data. The
      files contain no addresses, and there is no TRON label model at all.
      Cloning the repository yields queries we cannot run against data we do
      not have. Running them needs a Dune subscription, which SPEC.md §1 rules
      out. See docs/DECISIONS.md D14.

  # -------------------------------------------------------------------------
  # Abuse reports. Unverified user submissions. SPEC.md §6.4: a single report
  # must never alone push an address into a high-risk band; that rule is
  # enforced in weights.yaml under labels.abuse_reports.
  # -------------------------------------------------------------------------
  - id: chainabuse
    name: "Chainabuse community reports"
    status: needs_review
    confidence: 0.5
    checked: 2026-09-20
    blocked_reason: >
      Bulk access requires an API key issued under terms that have not yet
      been read by a human. Left disabled until they are. Do not enable by
      scraping the public site.

  - id: cryptoscamdb
    name: "CryptoScamDB"
    status: allowed
    confidence: 0.5
    schedule: weekly
    url: "https://github.com/CryptoScamDB/blacklist"
    format: git
    licence: "MIT"
    redistribution: permitted
    checked: 2026-09-20
    notes: >
      Repository is archived upstream and no longer actively maintained;
      useful for historical scam addresses, stale for recent ones. This
      staleness is recorded in docs/METHODOLOGY.md as a known limitation.

  - id: scamsniffer
    name: "ScamSniffer phishing address feed"
    status: allowed
    confidence: 0.5
    schedule: daily
    url: "https://github.com/scamsniffer/scam-database"
    format: git
    licence: "MIT"
    redistribution: permitted
    checked: 2026-09-20

  # -------------------------------------------------------------------------
  # Exchange proof-of-reserves address lists. docs/DECISIONS.md D19.
  #
  # Published by each exchange about its own wallets, usually with a signed
  # message per address proving control. Labelled unnamed_service with the
  # exchange named as entity: a reserve list establishes who controls an
  # address, not the exchange's KYC standard, which is what separates
  # `exchange` from `high_risk_exchange`.
  # -------------------------------------------------------------------------
  - id: htx_por
    name: "HTX proof-of-reserves addresses"
    status: allowed
    confidence: 0.9
    schedule: weekly
    url: "https://raw.githubusercontent.com/huobiapi/Tool-Node.js-VerifyAddress/main/snapshot/huobi_por.csv"
    format: csv
    licence: "MIT"
    redistribution: permitted
    checked: 2026-09-21
    notes: >
      The exchange's own GitHub organisation (huobiapi). 15 TRON addresses as
      of the 2026-09-08 snapshot, 14 with an ownership signature.

  - id: poloniex_por
    name: "Poloniex proof-of-reserves addresses"
    status: allowed
    confidence: 0.9
    schedule: weekly
    url: "https://raw.githubusercontent.com/poloniex/tools-nodejs-address-verify/master/snapshot/poloniex_por.csv"
    format: csv
    licence: "MIT"
    redistribution: permitted
    checked: 2026-09-21
    notes: >
      The exchange's own GitHub organisation. 7 TRON addresses as of the
      2026-09-15 snapshot, 6 with an ownership signature.

  - id: binance_por
    name: "Binance proof-of-reserves wallet addresses"
    status: blocked
    confidence: 0.9
    checked: 2026-09-21
    blocked_reason: >
      The list is served from binance.com (bapi/apex/.../por/address), not
      from Binance's documented trading API. Binance's Terms of Use prohibit
      using "web crawlers, bots, spiders or other automatic devices,
      programs, scripts, algorithms or methods, or any similar or equivalent
      manual processes to access, obtain, copy or monitor any part of the
      Platform". The "equivalent manual processes" wording rules out copying
      the list by hand as well. SPEC.md §6.2 directs us to stop rather than
      work around this. It is the most valuable exchange list for TRON, and
      the loss is real: every Binance wallet in stored data had already been
      detected as an unnamed service (docs/DECISIONS.md D19).
    substitutes: ["derived:service", "controlled test transfers (labeler trace-tx)"]

  - id: okx_por
    name: "OKX proof-of-reserves addresses"
    status: needs_review
    confidence: 0.9
    checked: 2026-09-21
    blocked_reason: >
      OKX's GitHub repository holds only the verification tool; the address
      file is downloaded from okx.com. OKX's website terms have not been read,
      so this stays disabled until they are.

  # -------------------------------------------------------------------------
  # Curated in-repo list. SPEC.md §6.5.
  # -------------------------------------------------------------------------
  - id: curated
    name: "Curated mixer and known-protocol contracts"
    status: allowed
    confidence: 0.95
    schedule: on_change
    path: "config/curated_labels.yaml"
    licence: "This repository"
    redistribution: permitted
    checked: 2026-09-20
    notes: >
      Hand-maintained. Every entry must carry an evidence URL. Reviewed
      whenever a new mixer or protocol becomes relevant.

  # -------------------------------------------------------------------------
  # Derived. Not an external source; produced by our own heuristics.
  # -------------------------------------------------------------------------
  - id: "derived:service"
    name: "Derived high-volume service addresses"
    status: allowed
    confidence: 0.75
    schedule: after_ingest
    licence: "Derived from chain data"
    redistribution: permitted
    checked: 2026-09-21
    notes: >
      Behavioural detection: an address transacting with hundreds of distinct
      counterparties and still paginating after a deep sample is a service.
      The evidence proves that it is a service, not which one, so matches are
      labelled unnamed_service and never exchange. A verified name from the
      curated source outranks this and should replace it. Thresholds in
      weights.yaml under derived_service.

  - id: "derived:deposit"
    name: "Derived exchange deposit wallets"
    status: allowed
    confidence: 0.6
    schedule: after_ingest
    licence: "Derived from chain data"
    redistribution: permitted
    checked: 2026-09-20
    notes: >
      Thresholds in weights.yaml under derived_deposit. Measured precision is
      recorded in docs/METHODOLOGY.md and must be re-measured whenever the
      thresholds change.

# ---------------------------------------------------------------------------
# Chain data sources, as distinct from label sources.
# ---------------------------------------------------------------------------
chains:
  - id: tron
    status: allowed
    adapter: trongrid
    url: "https://api.trongrid.io"
    auth: "optional TRONGRID_API_KEY for higher rate limits"
    # Measured 2026-09-21 with nothing else competing: 3/s completed 10 of 10
    # requests with no throttling, while 5/s was rejected 6 times out of 10.
    #
    # The configured rate was never buying throughput. Each request costs about
    # a second of latency, so a single stream achieves ~1/s whatever this says.
    # Setting it higher only produced 429s, and each 429 triggered backoff of up
    # to 30 seconds — so the aggressive setting made ingestion slower, not
    # faster, and abandoned three addresses outright.
    rate_limit_per_sec: 3
    # With TRONGRID_API_KEY the free plan allows 15 QPS and 100,000 requests a
    # day per key; exceeding it blocks access for 30 seconds. The key is shared
    # by the worker pool, on-demand screening and the service sampler (which
    # takes half), so this stays well below 15. Measured 2026-09-21 with the
    # key: 10 of 10 requests succeeded, and sampling cost 0.86 s per address
    # with no 429s, against about 8 s and 60-80% throttled without it.
    rate_limit_per_sec_with_key: 8
    checked: 2026-09-21
    notes: "Free tier is sufficient for demand-driven per-address ingestion."

  - id: ethereum
    status: unavailable
    adapter: "evm-jsonrpc"
    url: "https://ethereum-rpc.publicnode.com"
    auth: "requires an archive-capable endpoint; ETH_RPC_URL overrides the default"
    rate_limit_per_sec: 10
    checked: 2026-09-21
    unavailable_reason: >
      The adapter works and is verified against this endpoint for recent
      blocks, but per-address history needs archive access and no public
      endpoint serves it usably: publicnode refuses archive requests outright,
      ankr and drpc require authentication, and 1rpc and pokt cap ranges at 50
      blocks, which is roughly 520,000 requests to cover the chain. Set
      ETH_RPC_URL to an archive-capable endpoint to enable this chain. See
      docs/METHODOLOGY.md §2.

  - id: bsc
    status: unavailable
    adapter: "evm-jsonrpc"
    url: "https://bsc-rpc.publicnode.com"
    auth: "requires an archive-capable endpoint; BSC_RPC_URL overrides the default"
    rate_limit_per_sec: 10
    checked: 2026-09-21
    unavailable_reason: >
      As ethereum, and worse: bsc-dataseed rate-limits eth_getLogs below
      usefulness even for a ten-block span. Set BSC_RPC_URL to an
      archive-capable endpoint to enable this chain.
