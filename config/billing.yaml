# billing.yaml — bot subscription plans (docs/DECISIONS.md D26).
#
# Not part of config_version: nothing here affects a score, and a price change
# must not make scores look as if they had changed.
#
# Prices are placeholders to set before selling. Telegram Stars: a user pays
# roughly $0.013-0.02 per Star depending on platform, and a developer receives
# about $0.013 per Star on withdrawal, so 800 Stars nets about $10. The Stars
# subscription price may not exceed 10,000 Stars (Bot API, createInvoiceLink).

version: 1

# Plans in ascending order. A user holding several active plans gets the
# highest.
plans:
  - id: basic
    name: Basic
    daily_screens: 20
    details: false        # /details full breakdown
    pdf: false            # /pdf one-page report
    watches: 3            # addresses monitored for risk changes
    batch: 0              # addresses per batch file; 0 = no batch screening
    api: false            # API keys
    price_stars: 800
    price_usdt: "10.00"
  - id: pro
    name: Pro
    daily_screens: 200
    details: true
    pdf: true
    watches: 25
    batch: 100
    api: false
    price_stars: 3800
    price_usdt: "49.00"
  - id: business
    name: Business
    daily_screens: 2000
    details: true
    pdf: true
    watches: 200
    batch: 1000
    api: true
    # The Stars ceiling for a subscription is 10,000 Stars (~$130 net), below
    # what this plan is worth; business customers are expected to pay USDT.
    price_stars: 10000
    price_usdt: "199.00"

# One free trial per Telegram account, granted on first contact.
trial:
  days: 7
  plan: basic

usdt:
  # How long a customer has to pay the exact amount.
  invoice_ttl: 1h
  # A payment arriving this long after its invoice expired still counts, as
  # long as its amount has not been reissued.
  grace: 24h
  # How often the payment address is checked.
  poll: 30s

# How long one paid period lasts. Stars fixes it at 30 days; USDT matches.
period_days: 30

# Watched addresses are rescreened on this schedule. Every rescreen spends
# TronGrid budget, so the interval times the total watches is the cost.
monitor:
  interval: 6h
  # Rescreens at most this many watches per pass; the rest wait for the next.
  per_pass: 200

# Follow-up after a screen that has not finished tracing (docs/DECISIONS.md
# D28). The first answer can cover a few percent of value while counterparties
# are still being fetched; the bot keeps rescreening in the background as the
# worker fetches each ring, and sends the final result when coverage stops
# growing. Follow-ups do not use the customer's daily screens.
deepen:
  # How often to check whether the worker has caught up.
  poll: 15s
  # A round's rescreen waits at most this long for the fetch queue to drain.
  round_wait: 5m
  # Coverage must grow by at least this many points per round to continue.
  min_gain_pct: 0.5
  max_rounds: 12
  max_duration: 45m
  # Follow-ups running at once; beyond this, a screen gets the usual
  # "screen again later" and no follow-up.
  concurrent: 10
