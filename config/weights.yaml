# weights.yaml — the single source of truth for scoring behaviour.
#
# SPEC.md §2: category weights, hop limits, decay factors and thresholds live
# here and never inline in Go. Changing a value here must change output with
# no code change (Phase 3 acceptance criterion).
#
# The SHA-256 of this file plus sources.yaml forms the config_version stamped
# on every result.

version: 1

# ---------------------------------------------------------------------------
# Controlled category vocabulary and risk weights.
#
# Weight is the contribution to the 0-100 score of one percentage point of
# traced value landing in that category. Justification for each value is in
# docs/METHODOLOGY.md; do not change one without updating that table.
# ---------------------------------------------------------------------------
categories:
  sanctions:            {weight: 100, description: "OFAC/UN/EU listed address"}
  terrorist_financing:  {weight: 100, description: "Designated terrorist financing"}
  darknet:              {weight: 90,  description: "Darknet market"}
  stolen_funds:         {weight: 85,  description: "Proceeds of a documented theft or exploit"}
  frozen_funds:         {weight: 85,  description: "USDT frozen by Tether: blacklisted on its own contract"}
  mixer:                {weight: 70,  description: "Mixing or tumbling service"}
  scam:                 {weight: 70,  description: "Fraud, phishing, ponzi"}
  high_risk_exchange:   {weight: 40,  description: "Exchange with absent or nominal KYC"}
  gambling:             {weight: 25,  description: "Gambling service"}
  # A service whose operator is named (by its own reserve list, or by chain
  # evidence tied to it) while its KYC tier is not rated. Weighted as an
  # unnamed service, since a name is not a KYC claim (D19), but its value
  # counts as seen for confidence, because we know who holds it (D32).
  named_service:        {weight: 15,  description: "Service with a named operator, KYC tier unrated"}
  unnamed_service:      {weight: 15,  description: "Service-shaped behaviour, operator unidentified"}
  dust:                 {weight: 5,   description: "Unsolicited inbound below the dust threshold"}
  dex:                  {weight: 5,   description: "Decentralised exchange or AMM"}
  exchange:             {weight: 2,   description: "Exchange with functioning KYC"}

# ---------------------------------------------------------------------------
# Score bands. Lower bound inclusive, upper bound exclusive; the top band's
# upper bound is inclusive. Bands must tile 0-100 with no gap or overlap;
# the config loader enforces this.
# ---------------------------------------------------------------------------
bands:
  - {name: low,    min: 0,  max: 30}
  - {name: medium, min: 30, max: 60}
  - {name: high,   min: 60, max: 100}

# SPEC.md §7: any direct sanctions hit reports as High regardless of the
# computed score.
sanctions_override_band: high

# ---------------------------------------------------------------------------
# Traversal
# ---------------------------------------------------------------------------
traversal:
  # Maximum hops from the queried address.
  max_hops: 5

  # Per-hop value decay in the haircut formula:
  #   contribution(path) = share(hop1) * ... * share(hopN) * decay^N
  decay: 0.5

  # Cap on neighbours expanded per node, highest value first. Hitting this cap
  # is recorded on the result so truncation is visible rather than silent.
  max_neighbours_per_node: 5000

  # Stop expanding at any labelled address. SPEC.md §7: without this rule
  # everything reaches a major exchange within six hops and every score
  # becomes noise. Effectively non-optional; exposed only for testing.
  terminate_at_labelled: true

  # Contributions below this fraction of total traced value are dropped rather
  # than expanded further. Bounds path explosion on dense graphs.
  min_contribution: 0.0001

# ---------------------------------------------------------------------------
# Dust. SPEC.md §7: anyone can send an unsolicited transfer to any address, so
# inbound dust must never meaningfully move the score. Below this USD value an
# inbound transfer from an unknown source is classified `dust` and excluded
# from traversal expansion entirely.
# ---------------------------------------------------------------------------
dust:
  usd_threshold: 1.0
  # Dust classification applies to inbound only. An outbound transfer of any
  # size is a deliberate act by the address owner and is never dust.
  inbound_only: true

# ---------------------------------------------------------------------------
# Coverage. SPEC.md §7: coverage = attributed_value / total_traced_value,
# reported in every response. Below the threshold the result is marked
# low-confidence and the report must say so prominently.
# ---------------------------------------------------------------------------
coverage:
  low_confidence_threshold: 0.40

# ---------------------------------------------------------------------------
# Label resolution. SPEC.md §6: highest confidence wins; ties broken by source
# priority; sanctions always win regardless of confidence; conflicting
# categories are recorded, never silently merged.
# ---------------------------------------------------------------------------
labels:
  source_priority:
    - ofac
    - un
    - eu
    - uk
    - tether_blacklist
    - curated
    - htx_por
    - poloniex_por
    - dune
    - derived:hotwallet
    - derived:operator
    - derived:poisoning
    - derived:deposit
    - derived:service
    - chainabuse
    - cryptoscamdb
    - scamsniffer

  # Categories that win regardless of confidence.
  always_wins:
    - sanctions
    - terrorist_financing
    # Tether's own freeze on its own contract (docs/DECISIONS.md D29).
    - frozen_funds

  # SPEC.md §6.4: never let a single unverified abuse report alone push an
  # address into a high-risk band. An address whose only evidence is abuse
  # reports needs at least this many independent ones to score above
  # `capped_band`.
  abuse_reports:
    sources: [chainabuse, cryptoscamdb, scamsniffer]
    min_independent_reports: 2
    capped_band: medium

# ---------------------------------------------------------------------------
# Derived deposit-wallet heuristic. SPEC.md §6: an address that repeatedly
# forwards funds to a known exchange hot wallet, with little other activity,
# is a deposit wallet of that exchange. Thresholds are config, not constants,
# and the measured precision is recorded in docs/METHODOLOGY.md.
# ---------------------------------------------------------------------------
derived_deposit:
  enabled: true
  # Minimum transfers to the same known hot wallet.
  min_transfers: 3
  # Minimum share of the address's total outbound value going to that wallet.
  min_outbound_share: 0.80
  # Maximum share of outbound value that may go anywhere else.
  max_other_share: 0.20
  # Confidence stamped on emitted labels.
  confidence: 0.6
  # Sources whose addresses anchor the heuristic whatever their category.
  # An exchange's own proof-of-reserves list proves it controls an address,
  # so a wallet sweeping into one is that exchange's deposit wallet. The
  # label keeps the anchor's category (unnamed_service for these, D19): the
  # list names the exchange without saying anything about its KYC tier
  # (docs/DECISIONS.md D25).
  anchor_sources: [htx_por, poloniex_por, "derived:hotwallet"]
  # Unfetched candidates queued per run. A candidate is judged on its whole
  # outbound history, which is unknown until fetched; the next run judges it.
  fetch_candidates: 200

# ---------------------------------------------------------------------------
# Behaviour notes (docs/DECISIONS.md D28). Patterns in an address's own
# activity that a reviewer should see. They are shown with the result and do
# not enter the score: a pass-through wallet can be layering or an OTC desk,
# and the notes say what was observed, not which it is.
# ---------------------------------------------------------------------------
behaviour:
  pass_through:
    # Both directions at least this much, in USD.
    min_volume_usd: 10000
    # At most this share of the larger side retained: |in - out| / max(in, out).
    max_retained_share: 0.05
    # Over a span of activity no longer than this.
    max_days: 30
  new_address:
    # First activity at most this many days before the screen.
    max_age_days: 30
    # A new address that has already moved at least this much, in and out
    # together, is noted as such rather than merely new.
    high_volume_usd: 1000000
  # The same round amount sent, in single transfers, to several wallets
  # within a short window: splitting (D30). TPJZrw…uBhM sent $1,000,000 to
  # six wallets within three minutes.
  round_split:
    min_amount_usd: 10000
    # A multiple of this, within a dollar, is round.
    round_to_usd: 1000
    min_recipients: 3
    max_minutes: 60
  # Wallets that received from the address and have sent nothing since,
  # counted only when their own history is fetched, so "sent nothing" is
  # known rather than assumed.
  parked:
    min_amount_usd: 10000
    min_wallets: 2
    min_total_usd: 50000
  # A wallet Tether froze in the last few days paid this one shortly before
  # the freeze (D34). Measured over 800 freezes (cmd/validate freeze): 3.1%
  # of wallets that received at least $1,000 in the week before were frozen
  # too, nearly all within three days; 0.12% of ordinary wallets' contacts.
  # After three days the rate is back near the baseline, so the note stops.
  frozen_contact:
    min_received_usd: 1000
    window_days: 7
    max_days_since: 3

# ---------------------------------------------------------------------------
# Verdict (docs/DECISIONS.md D29): the answer to "is this wallet clean?" in
# three states, with reasons and a confidence. It reads the score, coverage,
# exposure and behaviour notes; it never changes them.
#
# Exposure is a share of traced value, both directions combined, in percent.
# ---------------------------------------------------------------------------
verdict:
  # Any of these at or above its share makes the verdict high risk.
  # Starting values, to be checked against the benchmark (cmd/validate
  # verdict), never tuned to match another vendor (SPEC.md §9.5).
  red_exposure:
    sanctions: 1
    terrorist_financing: 1
    frozen_funds: 5
    stolen_funds: 5
    darknet: 5
    mixer: 10
    scam: 10
    high_risk_exchange: 25
    gambling: 40
  # A clean verdict needs at least this coverage and finished tracing. Below
  # it the answer is caution: unknown, not clean.
  # An address whose own label is one of these, an exchange's deposit wallet
  # for instance, is answered by whose it is: low coverage and unfinished
  # tracing do not count against it, and confidence rises to the label's.
  # Risk in its flows still decides (D39).
  own_service_categories: [exchange, named_service]
  clear_min_coverage: 0.80
  # Tracing counts as finished when the value still waiting at unfetched
  # dead ends is under this share of traced value, in percent. One pending
  # address carrying a trace of value should not withhold an answer.
  max_pending_pct: 5
  # A clean verdict also needs most traced value to end somewhere named.
  # When at least this share, in percent, ends at unidentified services,
  # the answer is caution: the other side of those services is not visible,
  # so their customers' funds cannot be vouched for (D30).
  max_unnamed_pct: 50
  # Confidence is a percentage: the share of traced value that could be
  # seen well enough to vouch for. Value at a named, non-risk entity counts
  # fully; value at a category below counts only by its credit (an
  # unidentified service is half seen: we know it is a service, not what is
  # behind it; dust proves nothing). Unknown value counts nothing, and each
  # behaviour note takes behaviour_penalty points off. A risky verdict's
  # confidence is its coverage, at least 50; a direct listing is 99.
  confidence_credit:
    unnamed_service: 0.5
    dust: 0
  behaviour_penalty: 15
  # A not-risky answer below this confidence, in percent, also says there
  # is not enough data: "not risky" alone would read as a clean bill.
  insufficient_below: 10
  # Confidence buckets, for the API's word: high at or above the first,
  # medium at or above the second, low below. Unfinished tracing is never high.
  confidence_high: 0.90
  confidence_medium: 0.60

# ---------------------------------------------------------------------------
# Derived exchange hot wallets (docs/DECISIONS.md D28). Reserve wallets refill
# an exchange's hot wallets and hot wallets sweep back, so a wallet with
# transfers both ways with one exchange's reserves, and service-shaped
# itself, is that exchange's hot wallet. Measured 2026-09-22 against the 22
# HTX and Poloniex reserve wallets: 5 wallets pass, 20 one-way or
# few-counterparty wallets (cold storage, OTC) do not.
# ---------------------------------------------------------------------------
derived_hotwallet:
  enabled: true
  # Sources whose addresses are the exchange's own reserve wallets.
  reserve_sources: [htx_por, poloniex_por]
  # Transfers each way between the wallet and one exchange's reserves.
  min_transfers_each_way: 3
  # Value the reserves sent it, in USD.
  min_inflow_usd: 100000
  # Distinct counterparties in stored history: a hot wallet pays many
  # customers; cold storage and OTC desks have a handful.
  min_counterparties: 250
  # Share of its reserve flows (in plus back) with that one exchange. A
  # wallet trading with several exchanges' reserves belongs to none of them.
  min_exclusive_share: 0.90
  confidence: 0.8

# ---------------------------------------------------------------------------
# Pricing. docs/PLAN.md F3: no commercial price feed is available, so USD
# values come from two sources of very different quality, and the difference
# is recorded rather than smoothed over.
#
# Stablecoins are pinned. Their peg is the assumption; a depeg would make
# historical values wrong, which is a known and accepted limitation for a
# triage tool.
#
# Everything else is valued from a daily close series, so an individual
# transfer carries real error. `price_basis` on each transfer records which
# applied, so a score resting on imprecisely-valued native flows can be told
# apart from one resting on stablecoins.
# ---------------------------------------------------------------------------
pricing:
  # asset -> fixed USD value
  pinned:
    USDT: 1.0
    USDC: 1.0
    TUSD: 1.0
    USDD: 1.0

  # Assets valued from the daily close series in the `prices` table.
  daily_close:
    - TRX
    - ETH
    - BNB

  # Where each daily close comes from: the largest stablecoin pool of the
  # asset's own chain, read from public chain data (D41). Each pool was
  # verified on 2026-09-23: its tokens are the ones below, and for the EVM
  # pools the factory's getPair returns this pool. A load checks the tokens
  # again before reading any price.
  pools:
    - asset: TRX
      chain: tron
      kind: justswap
      # JustSwap/SunSwap v1 TRX-USDT exchange; tokenAddress() is USDT.
      pool: TQn9Y2khEsLJW1ChVWFMSMeRDow5KcbLSE
      quote: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
      since: "2020-08-15"
    - asset: ETH
      chain: ethereum
      kind: uniswap_v2
      # Uniswap v2 WETH/USDT, the factory's canonical pair.
      pool: "0x0d4a11d5eeaac28ec3f61d100daf4d40471f1852"
      base: "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"
      quote: "0xdac17f958d2ee523a2206206994597c13d831ec7"
      since: "2020-05-06"
    - asset: BNB
      chain: bsc
      kind: uniswap_v2
      # PancakeSwap v2 WBNB/USDT, the factory's canonical pair.
      pool: "0x16b9a82891338f9ba80e2d6970fdda79d1eb0dae"
      base: "0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c"
      quote: "0x55d398326f99059ff775485246999027b3197955"
      since: "2021-04-24"

  # An asset in neither list contributes no USD value and is counted as
  # unpriced. It is never assumed to be worth zero — `unpriced_count` on each
  # edge carries that forward so coverage can reflect it.

# ---------------------------------------------------------------------------
# Derived service detection.
#
# An address transacting with hundreds of distinct counterparties, still
# paginating after a deep sample, is a service: an exchange, a payment
# processor, a desk, a bridge. The behaviour proves *that* it is a service. It
# does not reveal *which*, and this configuration deliberately does not pretend
# otherwise — matches are labelled `unnamed_service`, never `exchange`.
#
# That distinction has teeth. `exchange` carries weight 2 because reaching a
# regulated exchange is close to reassuring; `unnamed_service` carries 15
# because an unidentified service might be a no-KYC swapper. Labelling a real
# exchange as unnamed_service overstates its users' risk, which is why a
# verified name from `curated` outranks this source and should replace it
# whenever one is available.
#
# Thresholds calibrated against measured samples on 2026-09-21:
#   514 distinct counterparties in 600 sampled transfers, still paginating -> service
#    52 in  78, exhausted -> not a service
#    31 in  39, exhausted -> not a service
#    20 in 237, exhausted -> concentrated, not a service
# ---------------------------------------------------------------------------
derived_service:
  enabled: true

  # How much history to sample before judging. Costs one API call per page.
  sample_pages: 3

  # Unlabelled candidates sampled per run, busiest first. About 1.5 API calls
  # each; 2,000 is ~3,000 calls, a small share of the daily key budget. It was
  # 200 and hard-coded, which left a backlog of 1,500 service-shaped addresses
  # unlabelled (docs/DECISIONS.md D30).
  max_candidates: 2000

  # Addresses whose history is already fetched are judged from it instead of
  # a 600-transfer sample (docs/DECISIONS.md D30). The sample only sees the
  # latest transfers; THasRe…geRM had 1,430 counterparties over its history
  # but few in its latest 600, and was rejected. A full history is the
  # stronger evidence and costs no API call. The ratio keeps out an active
  # wallet that trades repeatedly with the same few parties.
  stored:
    min_transfers: 400
    min_counterparties: 250
    min_counterparty_ratio: 0.2
    # A service runs for months. A wallet that is broad but weeks old is more
    # likely a transit hub, and labelling it a service would stop traversal
    # at it and hide what is behind: TNiE8x…tR2R, the $54M hub of the
    # TJBsbT…8Y5P network, was 18 days old when first labelled (D30).
    min_active_days: 90
  page_size: 200

  # An address must exceed all three to qualify.
  #
  # min_counterparties is the discriminating signal. A ratio alone does not
  # work: a 39-transfer wallet scored 0.795 distinct-per-transfer in testing,
  # which is higher than some genuine services, because small samples are
  # trivially diverse.
  min_transfers_sampled: 400
  min_counterparties: 250

  # The sample must not have exhausted the address's history. An address whose
  # entire life fits in three pages is not a service however diverse it looks.
  require_more_pages: true

  # High, because the behavioural evidence for "this is a service" is strong
  # and unambiguous. The uncertainty in this label is about *which* service,
  # and that uncertainty is carried by the category's weight rather than by
  # the confidence.
  confidence: 0.75

# ---------------------------------------------------------------------------
# Operator grouping (docs/DECISIONS.md D31). A TRON account exists once
# something pays to create it, and operators create their wallets from a few
# operations accounts. Wallets sharing such an activator are one operator's.
derived_operator:
  enabled: true
  # Activations read per run, one API call each.
  max_fetches: 3000
  # The smallest creating transfer that names its sender as the reserve
  # wallet's operator. Anyone can send a fraction of a TRX to an address;
  # two HTX reserves were first reached by 0.1 and 1 TRX.
  min_creator_trx: 10

# ---------------------------------------------------------------------------
# Address poisoning (docs/DECISIONS.md D32). A dust transfer to a victim from
# an address that starts and ends like one of the victim's real
# counterparties is a poisoning, and its sender is labelled scam. The match
# counts from the leading T, so 4 + 4 fixes seven random characters: odds of
# a coincidence are about one in two trillion per comparison.
derived_poisoning:
  enabled: true
  max_dust_usd: 1
  min_real_usd: 100
  match_prefix: 4
  match_suffix: 4
